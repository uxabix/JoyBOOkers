<div class="card shadow-sm border-0 mb-4">
  <div class="card-header bg-white fw-semibold">
    <i class="bi bi-person-plus me-1"></i>Przypisanie nowego profilu do klastra
  </div>
  <div class="card-body">
    <p class="text-muted small mb-3">
      Wprowadź do pięciu ocen (skala 1–5), aby zasymulować profil użytkownika.
      Ten sam model K-Means co w aplikacji (<code>predict_cluster</code>).
    </p>
    <form hx-post="/clustering/predict"
          hx-target="#cluster-predict-result"
          hx-indicator="#cluster-predict-spinner">
      <div class="row g-2 mb-3">
        {% for i in range(1, 6) %}
        <div class="col">
          <label class="form-label small" for="rating_{{ i }}">Ocena {{ i }}</label>
          <input type="number" class="form-control form-control-sm" id="rating_{{ i }}"
                 name="rating_{{ i }}" min="1" max="5" step="1"
                 placeholder="1–5">
        </div>
        {% endfor %}
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary btn-sm">
          <i class="bi bi-diagram-3 me-1"></i>Przypisz klaster
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm"
                onclick="[1,2,3,4,5].forEach(function(i){var el=document.getElementById('rating_'+i);el.value=[5,5,4,5,5][i-1]})">
          Przykład: entuzjasta
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm"
                onclick="[1,2,3,4,5].forEach(function(i){var el=document.getElementById('rating_'+i);el.value=[3,3,2,3,2][i-1]})">
          Przykład: krytyk
        </button>
      </div>
    </form>
    <div class="htmx-indicator text-primary pt-2" id="cluster-predict-spinner">
      <div class="spinner-border spinner-border-sm me-2" role="status"></div>Przypisywanie&hellip;
    </div>
    <div id="cluster-predict-result" class="mt-3"></div>
  </div>
</div>
