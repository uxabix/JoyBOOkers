{% extends "base.html" %}
{% block title %}Error {{ status_code }} — {{ app_name or "JoyBookers" }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-4 text-muted">{{ status_code }}</h1>
  <p class="lead">{{ detail }}</p>
  {% if errors %}
  <pre class="text-start small bg-light p-3 rounded mx-auto" style="max-width:640px">{{ errors }}</pre>
  {% endif %}
  <a href="/" class="btn btn-primary mt-3">Back to home</a>
</div>
{% endblock %}
